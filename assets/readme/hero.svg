<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">大书库 · 3D导览 — 黑暗之魂3 Grand Archives</title>
  <desc id="desc">深蓝夜空底、暖橙烛光：黑暗之魂3 大书库 3D导览；右侧是哥特式书库简笔建筑，四层楼体加八角尖塔，底部一簇篝火。</desc>

  <rect width="1200" height="360" rx="26" fill="#141a24"/>
  <rect x="0" y="300" width="1200" height="60" fill="#0e131b"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#9a8f7d">黑暗之魂3 · DARK SOULS III · 洛斯里克</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#ffb066">大书库 · 3D导览</text>
    <text x="56" y="168" font-size="23" fill="#e8e2d6">GRAND ARCHIVES — 四层楼、39 个部件，逐一参观</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">外观 / 内部 / 屋顶 / 透视，拖拽旋转，点击部件看介绍。</text>
    <g id="chips" font-size="18" fill="#e8e2d6" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1d2531" stroke="#3a4356" stroke-width="1.5"/><text x="119" y="262">39 个部件</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#1d2531" stroke="#3a4356" stroke-width="1.5"/><text x="257" y="262">4 种视角</text></g>
      <g><rect x="332" y="238" width="150" height="36" rx="18" fill="#1d2531" stroke="#3a4356" stroke-width="1.5"/><text x="407" y="262">分层展开</text></g>
      <g><rect x="494" y="238" width="186" height="36" rx="18" fill="#1d2531" stroke="#3a4356" stroke-width="1.5"/><text x="587" y="262">Three.js 实时渲染</text></g>
    </g>
  </g>

  <g id="archives" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="860" y="26" font-size="18" fill="#9a8f7d">L1 入口 · L2 蜡池 · L3 藏书 · L4 王座</text>
    <!-- ground -->
    <rect x="780" y="316" width="360" height="8" rx="4" fill="#2a2f3a"/>
    <!-- L1 -->
    <rect x="820" y="252" width="280" height="64" fill="#4a463e"/>
    <rect x="820" y="252" width="280" height="6" fill="#5d584d"/>
    <!-- L2 -->
    <rect x="820" y="196" width="280" height="56" fill="#565249"/>
    <rect x="820" y="196" width="280" height="6" fill="#6a655a"/>
    <!-- L3 -->
    <rect x="820" y="140" width="280" height="56" fill="#4a463e"/>
    <rect x="820" y="140" width="280" height="6" fill="#5d584d"/>
    <!-- L4 (narrower) -->
    <rect x="850" y="92" width="220" height="48" fill="#565249"/>
    <rect x="850" y="92" width="220" height="6" fill="#6a655a"/>
    <!-- spire -->
    <polygon points="960,92 920,92 960,44" fill="#3a3733"/>
    <polygon points="960,92 1000,92 960,44" fill="#2e2b28"/>
    <circle cx="960" cy="40" r="4" fill="#ffb066"/>
    <!-- arched windows (lit) -->
    <g fill="#ffcf8a">
      <path d="M850 300 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M900 300 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1000 300 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1050 300 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M850 244 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M900 244 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1000 244 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1050 244 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M850 188 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M900 188 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1000 188 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1050 188 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M880 136 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M940 136 v-26 a10 10 0 0 1 20 0 v26 z"/>
      <path d="M1000 136 v-26 a10 10 0 0 1 20 0 v26 z"/>
    </g>
    <!-- double door -->
    <path d="M950 316 v-30 a10 10 0 0 1 20 0 v30 z" fill="#171310" stroke="#8a6a3a" stroke-width="2"/>
    <!-- bonfire -->
    <g transform="translate(800 316)">
      <ellipse cx="0" cy="2" rx="16" ry="4" fill="#3a2a18"/>
      <path d="M0 -26 C 8 -14, 10 -8, 4 -2 C 10 2, 6 8, 0 8 C -6 8, -10 2, -4 -2 C -10 -8, -8 -14, 0 -26 Z" fill="#ff8c2e"/>
      <path d="M0 -12 C 4 -6, 5 -3, 2 0 C 5 2, 3 5, 0 5 C -3 5, -5 2, -2 0 C -5 -3, -4 -6, 0 -12 Z" fill="#ffd9a8"/>
    </g>
    <!-- labels -->
    <g font-size="16" fill="#ffb066">
      <text x="1112" y="130">王座</text>
      <text x="1112" y="184">藏书</text>
      <text x="1112" y="240">蜡池</text>
      <text x="1112" y="296">入口</text>
    </g>
    <g stroke="#5a3a22" stroke-width="1.5">
      <line x1="1104" y1="126" x2="1110" y2="126"/>
      <line x1="1104" y1="180" x2="1110" y2="180"/>
      <line x1="1104" y1="236" x2="1110" y2="236"/>
      <line x1="1104" y1="292" x2="1110" y2="292"/>
    </g>
  </g>
</svg>
